<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="dgTitle dgDesc">
  <title id="dgTitle">ibd-skills 依赖关系图</title>
  <desc id="dgDesc">箭头方向为依赖方向，A 指向 B 表示 A 依赖 B。实线为硬依赖，虚线为可选或汇总口。</desc>

  <defs>
    <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="610" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ============ 图例 ============ -->
  <g font-family="'PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="16" y="40" font-size="11" letter-spacing="2" fill="#9ca3af">图例</text>
    <path d="M 16 60 H 50" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#ah-r)"/>
    <text x="60" y="64" font-size="12" fill="#374151">硬依赖</text>
    <path d="M 16 84 H 50" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-d)"/>
    <text x="60" y="88" font-size="12" fill="#4b5563">可选 / 汇总口</text>
    <text x="16" y="112" font-size="10.5" fill="#9ca3af">实线 = 缺则核心功能不可用</text>
    <text x="16" y="129" font-size="10.5" fill="#9ca3af">虚线 = 缺则降级</text>
    <text x="16" y="152" font-size="10.5" fill="#6b7280">箭头 = 依赖方向</text>
    <text x="16" y="168" font-size="10.5" fill="#6b7280">A &#8594; B 即 A 依赖 B</text>
  </g>

  <!-- ============ 连线 ============ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 入口 → 写作 -->
    <path d="M 140 258 H 180" stroke="#374151" stroke-width="2" marker-end="url(#ah-r)"/>
    <!-- 写作 → 质量门禁（硬） -->
    <path d="M 285 220 V 126" stroke="#374151" stroke-width="2" marker-end="url(#ah-r)"/>
    <!-- 写作 → 交付枢纽（硬） -->
    <path d="M 390 258 H 560" stroke="#374151" stroke-width="2" marker-end="url(#ah-r)"/>
    <!-- 写作 → 方法论沉淀（可选） -->
    <path d="M 285 296 V 400" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-d)"/>
    <!-- 方法论检索 → 方法论沉淀（硬） -->
    <path d="M 285 520 V 468" stroke="#374151" stroke-width="2" marker-end="url(#ah-r)"/>
    <!-- 批注 → 交付枢纽（硬） -->
    <path d="M 920 125 H 848 V 240 H 780" stroke="#374151" stroke-width="2" marker-end="url(#ah-r)"/>
    <!-- 财务复核 → 交付枢纽（可选） -->
    <path d="M 920 260 H 780" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-d)"/>
    <!-- 法律复核 → 交付枢纽（汇总口） -->
    <path d="M 920 395 H 892 V 280 H 780" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-d)"/>
    <!-- 交付枢纽 → 平台 docx 工具（硬） -->
    <path d="M 670 300 V 420" stroke="#374151" stroke-width="2" marker-end="url(#ah-r)"/>
  </g>

  <!-- ============ 连线标注 ============ -->
  <g font-family="'PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" fill="#9ca3af">
    <text x="300" y="354">可选</text>
    <text x="852" y="250">可选</text>
    <text x="896" y="336">汇总口</text>
  </g>

  <!-- ============ 节点 ============ -->
  <g font-family="'PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">

    <!-- 入口 -->
    <rect x="10" y="233" width="130" height="50" rx="25" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="75" y="264" font-size="12.5" fill="#6b7280" text-anchor="middle">写作线 · 草稿</text>

    <!-- 质量门禁 -->
    <rect x="180" y="60" width="210" height="66" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="198" y="88" font-size="14.5" font-weight="600" fill="#6d28d9">ibd-quality-gates</text>
    <text x="198" y="108" font-size="11.5" fill="#6b7280">质量门禁 · 基座</text>

    <!-- 写作 -->
    <rect x="180" y="220" width="210" height="76" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="198" y="252" font-size="14.5" font-weight="600" fill="#b45309">ibd-doc-write</text>
    <text x="198" y="274" font-size="11.5" fill="#6b7280">写作 · 草稿产出</text>

    <!-- 方法论沉淀 -->
    <rect x="180" y="400" width="210" height="68" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="198" y="430" font-size="14.5" font-weight="600" fill="#6d28d9">ibd-methods-ops</text>
    <text x="198" y="452" font-size="11.5" fill="#6b7280">方法论沉淀 · 基座</text>

    <!-- 方法论检索 -->
    <rect x="180" y="520" width="210" height="60" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
    <text x="198" y="548" font-size="14.5" font-weight="600" fill="#0e7490">ibd-methods-query</text>
    <text x="198" y="568" font-size="11.5" fill="#6b7280">方法论检索</text>

    <!-- 交付枢纽 -->
    <rect x="560" y="220" width="220" height="80" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="578" y="252" font-size="14.5" font-weight="600" fill="#1d4ed8">ibd-doc-review</text>
    <text x="578" y="276" font-size="11.5" fill="#6b7280">交付枢纽 · 清单契约源</text>

    <!-- 平台工具 -->
    <rect x="560" y="420" width="220" height="72" rx="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="578" y="452" font-size="14.5" font-weight="600" fill="#4b5563">平台 docx 工具</text>
    <text x="578" y="474" font-size="11.5" fill="#6b7280">样式套用 / 新建 docx</text>

    <!-- 批注 -->
    <rect x="920" y="90" width="210" height="70" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="938" y="122" font-size="14.5" font-weight="600" fill="#047857">ibd-doc-annotate</text>
    <text x="938" y="144" font-size="11.5" fill="#6b7280">批注 · 修订 · 复核报告</text>

    <!-- 财务复核 -->
    <rect x="920" y="225" width="210" height="70" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="938" y="257" font-size="14.5" font-weight="600" fill="#047857">ibd-finance-review</text>
    <text x="938" y="279" font-size="11.5" fill="#6b7280">财务域复核</text>

    <!-- 法律复核 -->
    <rect x="920" y="360" width="210" height="70" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="938" y="392" font-size="14.5" font-weight="600" fill="#047857">ibd-legal-review</text>
    <text x="938" y="414" font-size="11.5" fill="#6b7280">法律域复核 · 惯例对照</text>

  </g>
</svg>
